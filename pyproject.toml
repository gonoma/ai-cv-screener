
[project]
name = "cv-screening"
version = "0.1.0"
description = "CV screening over a synthetic corpus: generation, retrieval, chat"
requires-python = ">=3.12"

dependencies = [
    # Generation pipeline (data_generation/). Runs once, offline.
    "pydantic>=2.9",
    "google-genai>=1.0",   # CV records and photos via Google AI Studio
    "openai>=1.60",         # OpenRouter is OpenAI-compatible; used only for its base_url
    "pillow>=11.0",                 # normalises photos for committing; draws the local monogram
    "jinja2>=3.1",                  # HTML templates
    "weasyprint>=63",               # HTML -> PDF
    "python-dotenv>=1.0",           # loads .env

    # Backend (backend/). FastAPI service: ingestion, routing, retrieval, chat.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",                # vector type adapter for psycopg
    "pypdf>=5.1",                   # primary PDF text extraction
    "pdfplumber>=0.11",             # fallback where pypdf mangles a multi-column page
    "fastembed>=0.5",               # local ONNX embeddings: no quota, no key, deterministic
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `backend/` carries __init__.py and sits at the repo root, so no package-dir
# mapping is needed. That also means the repo-root directory *is* the package
# rather than shadowing it — see the namespace-package note in backend/__init__.py.
include = ["data_generation*", "backend*"]

[tool.setuptools.package-data]
"data_generation.rendering" = ["templates/*.html"]

[tool.pytest.ini_options]
# Declared so `pytest.mark.integration` is a marker rather than a typo warning.
# These tests read the real corpus off disk instead of a fixture, so they are
# the ones to deselect (`-m "not integration"`) on a fresh clone.
markers = ["integration: runs against the generated corpus in data/"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ours, so isort groups them apart from third-party imports.
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `backend` resolves through package-dir, which ruff cannot see, so say it here
# rather than let isort file our own packages under third-party.
known-first-party = ["backend", "data_generation"]
