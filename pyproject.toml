
[project]
name = "cv-screening"
version = "0.1.0"
description = "CV screening over a synthetic corpus: generation, retrieval, chat"
requires-python = ">=3.12"

dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_generation*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ours, so isort groups them apart from third-party imports.
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["data_generation"]
